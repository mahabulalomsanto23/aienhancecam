name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Android lint
        run: gradle --no-daemon lint

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug and release variants
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload build outputs to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ai-camera-pro-build-outputs
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/lint-results/**/*.html
          if-no-files-found: error
          retention-days: 14
